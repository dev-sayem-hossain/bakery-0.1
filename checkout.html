<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | SweetHome Bakery</title>

<body data-page="checkout"><div id="site-header"></div><main>

</main><div id="site-footer"></div><div id="toast"></div><script src="assets/js/app.js"></script></body></html>
